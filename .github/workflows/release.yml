name: Release

# Tag a commit to publish. The archive produced here serves two purposes: it is what a new
# user downloads and what the in-app updater fetches. Keeping them the same file means the
# update path is exercised by every release rather than only when someone tests it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without a leading v)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 deliberately: a binary built against an older glibc runs on newer distros,
          # but not the other way round.
          - os: ubuntu-22.04
            platform: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version is consistent
        # A tag that disagrees with the source version makes every installed copy either
        # re-download the same release forever or refuse one it should take.
        run: uv run --no-project python scripts/check_version.py "${{ steps.version.outputs.value }}"

      - name: Install Qt and audio runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libportaudio2 libdbus-1-3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build the application
        run: uv run pyinstaller --noconfirm --clean packaging/yada.spec

      - name: Build the launcher
        run: uv run pyinstaller --noconfirm --clean packaging/yada-launcher.spec

      - name: Build the double-click installer
        run: uv run pyinstaller --noconfirm --clean packaging/installer.spec

      - name: Assemble the payload
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          # One archive, two jobs: the installer scripts make it a first-time install, and
          # the app plus _internal make it an update payload.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/yada-launcher.exe dist/yada/yada-launcher.exe
            cp dist/INSTALL.exe dist/yada/INSTALL.exe
            cp packaging/install.ps1 dist/yada/install.ps1
          else
            cp dist/yada-launcher dist/yada/yada-launcher
            cp dist/INSTALL dist/yada/INSTALL
            chmod +x dist/yada/yada-launcher dist/yada/yada dist/yada/INSTALL
            cp packaging/install.sh dist/yada/install.sh
            chmod +x dist/yada/install.sh
          fi
          # Tells a human which file to open; the rest of the folder is the runtime.
          cp packaging/README-release.txt dist/yada/README.txt
          # Sanity check: extract_release refuses an archive without this, so fail here
          # instead of shipping something no client will install.
          test -f "dist/yada/yada" || test -f "dist/yada/yada.exe"
          printf '%s\n' "$VERSION" > dist/yada/VERSION

      - name: Archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          NAME="yada-${VERSION}-${{ matrix.platform }}"
          mkdir -p out
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../out/${NAME}.zip" yada
          else
            tar -czf "../out/${NAME}.tar.gz" yada
          fi

      - name: Smoke test the built application
        # Bounded on purpose. Without this a hang runs until the 6-hour job limit.
        timeout-minutes: 8
        # The point of this job: prove the binaries actually start on a real machine of
        # this OS before anything is published, instead of finding out from a user.
        # Exercises the frozen import graph, the installer, and a launch/IPC/stop cycle.
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash packaging/smoke_test.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: yada-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Checksum
        working-directory: staging
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the checksum manifest
        # The signature is what lets a client distinguish a release the maintainer published
        # from one anybody with repository write access pushed. Without the secret the job
        # fails rather than publishing something clients will refuse to install.
        env:
          YADA_SIGNING_KEY: ${{ secrets.YADA_SIGNING_KEY }}
        run: |
          if [ -z "${YADA_SIGNING_KEY}" ]; then
            echo "::error::YADA_SIGNING_KEY is not set. Run scripts/gen_signing_key.py and add it."
            exit 1
          fi
          uv run --with cryptography python scripts/sign_release.py staging/SHA256SUMS

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        # Idempotent and retried on purpose. Asset upload is a large multipart request to
        # GitHub and a transient 502 mid-upload is a normal failure mode -- one cost 0.1.1
        # a manual re-run, having already created the tag. Creating the release and
        # uploading the assets are now separate, both safe to repeat.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          NOTES="Installed copies of yada pick this up automatically in the background and use it at next launch."

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} already exists, reusing it"
          else
            gh release create "v${VERSION}" \
              --title "yada ${VERSION}" \
              --generate-notes \
              --notes "$NOTES"
          fi

          for attempt in 1 2 3; do
            if gh release upload "v${VERSION}" staging/* --clobber; then
              echo "assets uploaded on attempt ${attempt}"
              exit 0
            fi
            echo "upload attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::asset upload failed after 3 attempts"
          exit 1
