name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Qt and audio runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libportaudio2 libdbus-1-3
      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        # Offscreen so Qt widgets can be constructed on a headless runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
