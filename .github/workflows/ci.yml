name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Qt and audio runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libportaudio2 libpulse0 libdbus-1-3
      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        # Offscreen so Qt widgets can be constructed on a headless runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

  e2e-kde:
    # yada against a real, headless KDE Plasma session: KWin, the portals and the Wayland
    # clipboard. Every Wayland bug so far lived in that conversation, where unit tests
    # cannot see. Fedora rather than Ubuntu because Ubuntu's runners ship Plasma 5, whose
    # KWin scripting API differs. Free on a public repository.
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 20
    env:
      # Fedora's packaged uv will not fetch the Python version .python-version pins.
      UV_PYTHON_DOWNLOADS: automatic
    steps:
      - uses: actions/checkout@v4

      - name: Install the KDE session pieces
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            kwin-wayland xdg-desktop-portal xdg-desktop-portal-kde dbus-daemon dbus-tools \
            systemd wl-clipboard uv python3 portaudio mesa-dri-drivers mesa-libEGL \
            libxkbcommon fontconfig dejavu-sans-fonts

      - name: Install
        run: uv sync --all-extras

      - name: End-to-end tests
        run: uv run python scripts/e2e_kde.py -v
